<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Gorjetas</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Container Principal da Aplicação -->
    <main id="calculator-container">

        <!-- Cabeçalho com Título -->
        <header>
            <h1 id="calculator-title">Calculadora de Gorjetas</h1>
        </header>

        <!-- Formulário de Entrada de Dados -->
        <form id="calculator-form">
            <!-- Campo: Valor Total da Conta -->
            <div class="input-group">
                <label for="bill-amount">Valor da Conta (R$):</label>
                <input type="number" id="bill-amount" name="billAmount" placeholder="Ex: 100.00" min="0" step="0.01"
                    required>
            </div>

            <!-- Campo: Porcentagem da Gorjeta -->
            <div class="input-group">
                <label for="tip-percentage">Porcentagem da Gorjeta (%):</label>
                <input type="number" id="tip-percentage" name="tipPercentage" placeholder="Ex: 15" min="0" step="1"
                    required>
            </div>

            <!-- Botão de Ação para Calcular -->
            <button type="button" id="calculate-button">Calcular Gorjeta</button>
        </form>

        <!-- Área de Exibição dos Resultados -->
        <section id="results-container" aria-live="polite">
            <h2 id="results-title">Resumo do Cálculo</h2>

            <div class="result-item">
                <span>Valor da Gorjeta:</span>
                <span id="tip-amount-display">R$ 0,00</span>
            </div>

            <div class="result-item">
                <span>Total a Pagar (Conta + Gorjeta):</span>
                <span id="total-amount-display">R$ 0,00</span>
            </div>
        </section>

    </main>

    <!-- Script com a lógica da aplicação -->
    <script src="./script.js"></script>
</body>

</html>
